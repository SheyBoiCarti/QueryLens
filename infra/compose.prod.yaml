# One API process per metadata database: volatile jobs/results are process owned.
services:
  proxy:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
    restart: unless-stopped
    ports:
      - "443:443"
    environment:
      QUERYLENS_DOMAIN: ${QUERYLENS_DOMAIN:?Set the public DNS hostname}
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    networks: [querylens-internal]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    deploy:
      resources:
        limits: {cpus: '1.0', memory: 256M}

  migrate:
    build: &api-build
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    environment: &api-environment
      ENVIRONMENT: production
      HOST: 0.0.0.0
      PORT: 8000
      METADATA_DATABASE_URL: ${METADATA_DATABASE_URL:?Set the URL-encoded PostgreSQL metadata URL}
      SESSION_COOKIE_SECURE: "true"
      SESSION_COOKIE_NAME: "__Host-querylens_session"
      ALLOWED_ORIGINS: '["https://${QUERYLENS_DOMAIN:?Set the public DNS hostname}"]'
      CREDENTIAL_KEYS_FILE: /run/secrets/keyring.json
      CREDENTIAL_ACTIVE_KEY_ID: ${CREDENTIAL_ACTIVE_KEY_ID:?Set the active key ID}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_API_KEY: ${LLM_API_KEY:?Set the model provider API key}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      SOURCE_PERMITTED_CIDRS: ${SOURCE_PERMITTED_CIDRS:-[]}
    command: [alembic, -c, /app/alembic.ini, upgrade, head]
    depends_on:
      metadata-db:
        condition: service_healthy
    networks: [querylens-internal]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  api:
    build: *api-build
    restart: unless-stopped
    user: "1000:1000"
    environment: *api-environment
    secrets:
      - source: credential-keyring
        target: keyring.json
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [querylens-internal]
    deploy:
      resources:
        limits: {cpus: '2.0', memory: 1024M}

  metadata-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: querylens_prod
      POSTGRES_USER: querylens_app
      POSTGRES_PASSWORD: ${METADATA_DB_PASSWORD:?Set the metadata database password}
    volumes:
      - metadata-data:/var/lib/postgresql/data
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U querylens_app -d querylens_prod"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks: [querylens-internal]
    deploy:
      resources:
        limits: {cpus: '1.0', memory: 512M}

secrets:
  credential-keyring:
    file: ${CREDENTIAL_KEYS_FILE:?Set the host path to the provisioned keyring JSON file}

volumes:
  metadata-data:
  caddy-data:
  caddy-config:

networks:
  querylens-internal:
    driver: bridge
