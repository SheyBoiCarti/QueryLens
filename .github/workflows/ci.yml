name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install disposable PostgreSQL fixture binaries
        run: sudo apt-get update && sudo apt-get install -y postgresql

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e apps/api[dev]

      - name: Lint Check (Ruff)
        run: |
          ruff check apps/api

      - name: Type Check (Mypy)
        run: |
          mypy --config-file apps/api/mypy.ini apps/api/src

      - name: Verify Contract Schema Parity
        run: |
          python scripts/export_schema.py --check

      - name: Run Python Test Suite
        run: |
          pytest apps/api/tests -v

  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Lint Web Frontend
        run: npm run lint --workspace=apps/web

      - name: Type Check Web Frontend
        run: npm run typecheck --workspace=apps/web

      - name: Run Web Component Tests (Vitest)
        run: npm run test --workspace=apps/web

  source-analytics:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - postgres: '17'
            mysql: '8.0'
          - postgres: '18'
            mysql: '8.4'
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: source-test-password
          POSTGRES_DB: analytics
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d analytics"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_ROOT_PASSWORD: source-test-password
          MYSQL_DATABASE: analytics
          MYSQL_USER: analytics
          MYSQL_PASSWORD: source-test-password
        ports:
          - 3306/tcp
        options: >-
          --health-cmd "mysqladmin ping -h localhost -psource-test-password"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e apps/api[dev]
      - name: Required real source journeys
        env:
          QUERYLENS_REQUIRE_SOURCES: '1'
          QUERYLENS_TEST_POSTGRESQL_URL: postgresql+psycopg://postgres:source-test-password@127.0.0.1:${{ job.services.postgres.ports[5432] }}/analytics
          QUERYLENS_TEST_MYSQL_URL: mysql+pymysql://analytics:source-test-password@127.0.0.1:${{ job.services.mysql.ports[3306] }}/analytics
        run: pytest apps/api/tests/integration/test_source_analytics_gate.py apps/api/tests/integration/test_adapters.py apps/api/tests/integration/test_execution.py apps/api/tests/integration/test_schema_reflection.py apps/api/tests/integration/test_vertical_slice.py -v
