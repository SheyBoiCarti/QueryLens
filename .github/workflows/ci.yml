name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e apps/api[dev]

      - name: Lint and Format Check (Ruff)
        run: |
          ruff check apps/api
          ruff format --check apps/api

      - name: Type Check (Mypy)
        run: |
          mypy apps/api/src

      - name: Run Python Test Suite
        run: |
          pytest apps/api/tests -v

  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Lint Web Frontend
        run: npm run lint --workspace=apps/web

      - name: Type Check Web Frontend
        run: npm run build --workspace=apps/web --noEmit

      - name: Run Web Component Tests (Vitest)
        run: npm run test:unit --workspace=apps/web
