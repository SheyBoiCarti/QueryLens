name: Benchmark Evaluation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e apps/api[dev]

      - name: Run Comparator & Benchmark Tests
        run: |
          pytest apps/api/tests/evaluation/test_comparison.py apps/api/tests/evaluation/test_benchmark.py -v

      - name: Run Deterministic Suite Evaluation
        run: |
          python -c "
          from querylens.evaluation.runner import evaluate
          evaluate(engine='postgres', provider='fake', case_set='benchmarks/cases/heldout.json')
          "
