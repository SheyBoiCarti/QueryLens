[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "querylens"
version = "0.1.0"
description = "Natural-language analytics application for PostgreSQL and MySQL"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "sqlalchemy>=2.0.29",
    "alembic>=1.13.1",
    "psycopg[binary]>=3.1.18",
    "pymysql>=1.1.0",
    "cryptography>=42.0.5",
    "argon2-cffi>=23.1.0",
    "sqlglot>=23.11.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.3",
    "click>=8.1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "ruff>=0.4.1",
    "mypy>=1.9.0",
]

[project.scripts]
querylens-admin = "querylens.admin:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
